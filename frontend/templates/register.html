{% extends "base.html" %}
{% block title %}Register - SmartStock AI{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <h1>SmartStock <span>AI</span></h1>
    <p class="subtitle">Create your account</p>

    <div id="error-message" class="error-message"></div>

    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
