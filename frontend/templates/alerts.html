{% extends "app_shell.html" %}
{% block title %}Alerts - SmartStock AI{% endblock %}
{% block page_content %}

<h2>Alerts</h2>

<div class="section-title">Create Alert</div>
<div class="card">
  <div class="grid grid-4">
    <div class="form-group">
      <label>Symbol</label>
      <input type="text" id="new-alert-symbol" placeholder="e.g. TCS">
    </div>
    <div class="form-group">
      <label>Alert Type</label>
      <select id="new-alert-type" onchange="toggleThresholdField()">
        <option value="PRICE_ABOVE">Price above</option>
        <option value="PRICE_BELOW">Price below</option>
        <option value="PROFIT_PERCENT">Profit % reaches</option>
        <option value="LOSS_PERCENT">Loss % reaches</option>
        <option value="RSI_OVERBOUGHT">RSI overbought</option>
        <option value="RSI_OVERSOLD">RSI oversold</option>
        <option value="MACD_CROSS">MACD crossover</option>
      </select>
    </div>
    <div class="form-group" id="new-alert-threshold-group">
      <label>Threshold</label>
      <input type="number" id="new-alert-threshold" step="0.01">
    </div>
    <div class="form-group" style="display:flex; align-items:flex-end;">
      <button class="btn btn-primary" style="width:auto;" onclick="createNewAlert()">Create</button>
    </div>
  </div>
  <div id="new-alert-error" class="error-message"></div>
</div>

<div class="section-title">Your Alerts</div>
<div class="table-card">
  <table>
    <thead>
      <tr><th>Symbol</th><th>Type</th><th>Threshold</th><th>Last Triggered</th><th>Created</th><th></th></tr>
    </thead>
    <tbody id="alerts-body">
      <tr><td colspan="6" class="table-empty">Loading…</td></tr>
    </tbody>
  </table>
</div>

{% endblock %}
{% block page_scripts %}
<script src="/static/js/alerts.js"></script>
{% endblock %}
